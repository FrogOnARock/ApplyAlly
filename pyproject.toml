[project]
name = "applyally"
version = "0.1.0"
description = ""
authors = [
    {name = "FrogOnARock",email = "themackrock@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "pandas (>=2.3.1,<3.0.0)",
    "numpy (>=2.3.1,<3.0.0)",
    "langgraph (>=0.5.2,<0.6.0)",
    "langsmith (>=0.4.5,<0.5.0)",
    "langchain[openai] (>=0.3.26,<0.4.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "google-adk (>=1.7.0,<2.0.0)",
    "litellm (>=1.74.6,<2.0.0)",
    "selenium (>=4.34.2,<5.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "undetected-chromedriver (>=3.5.5,<4.0.0)",
    "pypdf2 (>=3.0.1,<4.0.0)",
    "pypdf (>=5.8.0,<6.0.0)"
]

[tool.poetry]
packages = [{include = "applyally", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
